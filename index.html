<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Analysis Tool</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js" defer></script>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js" defer></script>
</head>

<body>
    <div class="container">
        <div class="header-controls">
            <div class="upload-section">
                <label for="fileInput" class="custom-file-upload">
                    Upload Excel File
                </label>
                <input type="file" id="fileInput" accept=".xlsx, .xls" multiple />
            </div>
            <div class="plate-input-section">
                <label for="plateNumber">Plate Number:</label>
                <input type="number" id="plateNumber" value="1" min="1" />
            </div>
            <button id="exportBtn" class="custom-file-upload" style="margin-left: 20px;">Export PDF</button>
        </div>

        <div id="results" class="hidden"></div>
    </div>
    <script src="script.js"></script>
</body>

</html>
