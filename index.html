<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Analysis Tool</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js" defer></script>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js" defer></script>
</head>

<body>
    <div class="container">
        <div class="header-controls">
            <div class="upload-section">
                <label for="fileInput" class="custom-file-upload">
                    Upload Excel File
                </label>
                <input type="file" id="fileInput" accept=".xlsx, .xls" />
            </div>
            <div class="plate-input-section">
                <label for="plateNumber">Plate Number:</label>
                <input type="number" id="plateNumber" value="2" min="1" />
            </div>
            <button id="exportBtn" class="custom-file-upload" style="margin-left: 20px;">Export PDF</button>
        </div>

        <div id="results" class="hidden">
            <div class="dashboard-grid">
                <div class="left-panel">
                    <h3 class="chart-title">Analysis of the distribution of spheroid diameters per well on
                        plate <span id="plateNumSpan">2</span> at Day 21 (J-2 before shipment)</h3>
                    <div id="violinPlot"></div>
                </div>

                <div class="right-panel">
                    <h1 id="mainTitle" class="plate-title">PLATE 2</h1>

                    <div class="plates-row">
                        <div class="plate-item">
                            <div id="plateDiagram" class="plate-grid"></div>
                            <p class="caption">Average organoids diameter and standard deviation values and
                                standard deviation percentage</p>
                        </div>

                        <div class="plate-item">
                            <div id="plateDiagram2" class="plate-grid placeholder-plate"></div>
                            <p class="caption">Percentage of not conforme organoids (passed in 2D under the
                                pattern)</p>
                        </div>
                    </div>
                </div>
            </div>

            <div id="statsTableContainer"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
